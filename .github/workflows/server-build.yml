name: Server Build & Docker

on:
  push:
    branches:
      - 'integration/**'
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Docker Image nach ghcr.io pushen'
        required: false
        default: 'false'
        type: boolean

env:
  UNITY_VERSION: 2022.3.62f3
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wiesenwischer-gameserver

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore Unity Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-LinuxServer-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-LinuxServer-

      - name: Build Linux Server
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: BuildScript.BuildLinuxServer
          versioning: Custom
          version: 0.1.${{ github.run_number }}

      - name: Upload Server Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-build
          path: Builds/Server/
          retention-days: 7

  docker:
    needs: build-server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.push_image == 'true'
    steps:
      - name: Checkout (Dockerfile)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dockerfile
            .dockerignore

      - name: Download Server Build
        uses: actions/download-artifact@v4
        with:
          name: linux-server-build
          path: Builds/Server/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
